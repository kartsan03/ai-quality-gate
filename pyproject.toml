[project]
name = "aiqg"
version = "0.3.1"
description = "Local quality gate for recorded AI/LLM outputs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["llm", "ai", "testing", "ci", "regression-testing", "evaluation", "quality-gate", "hallucination", "promptfoo", "deepeval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PyYAML>=6",
    "jsonschema>=4",
]

[project.urls]
Repository = "https://github.com/kartsan03/ai-quality-gate"
Issues = "https://github.com/kartsan03/ai-quality-gate/issues"
Changelog = "https://github.com/kartsan03/ai-quality-gate/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kartsan03/ai-quality-gate/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aiqg = "aiqg.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiqg"]

[tool.setuptools.package-data]
aiqg = ["case_schema.json"]
