[project]
name = "aiqg"
version = "0.2.0"
description = "Local quality gate for recorded AI/LLM outputs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6",
    "jsonschema>=4",
]

[project.urls]
Repository = "https://github.com/kartsan03/ai-quality-gate"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aiqg = "aiqg.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiqg"]
